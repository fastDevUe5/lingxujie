[/Script/Engine.RendererSettings]
; Next-gen look for the prototype: Lumen GI + virtual shadow maps.
; Revisit for the MMO scale test (P0.5) - Lumen is expensive with many players on screen.
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Shadow.Virtual.Enable=1
r.DefaultFeature.Bloom=True
r.DefaultFeature.AutoExposure=False
; Fixed exposure: headless screenshots used to be washed out because auto exposure was still
; adapting when the capture fired. Locking it also keeps a consistent look between runs.
r.DefaultFeature.MotionBlur=False
; TSR instead of TAA: cleaner edges on the low-poly silhouettes (Epic's default for new 5.x projects).
r.AntiAliasingMethod=4
r.GenerateMeshDistanceFields=True
r.AllowStaticLighting=False
r.DefaultFeature.LightUnits=1
r.Lumen.HardwareRayTracing=False
; Nanite needs Shader Model 6. Megascans/marketplace assets are Nanite by default, and with
; SM5 they fall back to a warning + broken display. RTX 5060 handles SM6 without trouble.
r.Nanite.ProjectEnabled=True
; Nanite Foliage / assemblies (UE 5.7+): required by Megaplants-style vegetation assets,
; otherwise the editor warns "Nanite vegetation is disabled" and the assets render wrong.
; Read-only CVars, so they only take effect after an editor restart.
r.Nanite.Foliage=1
r.Nanite.AllowAssemblies=1

[/Script/Engine.Engine]
